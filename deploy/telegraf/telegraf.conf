# Telegraf: subscribe to twin/# topics, write to InfluxDB.

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["twin/+/joint/+/position", "twin/+/joint/+/velocity", "twin/+/joint/+/effort"]
  qos = 0
  data_format = "json"
  json_string_fields = []
  topic_tag = "topic"

  # Parse the MQTT topic into tags: twin/<asset>/joint/<joint>/<metric>
  [[inputs.mqtt_consumer.topic_parsing]]
    topic       = "twin/+/joint/+/+"
    measurement = "_/_/measurement/_/_"
    tags        = "_/asset/_/joint/metric"

[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "dev-token-change-me"
  organization = "twin"
  bucket       = "telemetry"
